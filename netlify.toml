# Netlify 部署配置
# 网易云音乐音频代理服务

[build]
  command = "echo 'Netlify Functions 部署完成'"
  publish = "."

# 重写规则：将 /audio/{song_id} 重写到函数
[[redirects]]
  from = "/audio/*"
  to = "/.netlify/functions/audio-proxy?song_id=:splat"
  status = 200
  force = true

# 首页重定向到 GitHub
[[redirects]]
  from = "/"
  to = "https://github.com/XiOuDi/163music-netlify-proxy"
  status = 302

# 函数配置
[functions]
  directory = "netlify/functions"
  timeout = 10

[functions."audio-proxy"]
  timeout = 10
